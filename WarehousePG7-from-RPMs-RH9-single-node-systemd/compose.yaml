services:
  sne:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - edbtoken_secret
        - edbrepository_secret
    secrets:
      - edbtoken_secret
      - edbrepository_secret
    ports:
      - "6442:5432"
      - "18080:8080"
      - "17234:7233"
    volumes:
      - ./data:/whpgdata
      # systemd needs the host cgroup hierarchy
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    # systemd-as-PID-1 requirements:
    cgroup: host
    tmpfs:
      - /run
      - /tmp
    # clean systemd shutdown -> warehousepg.service ExecStop runs gpstop
    stop_signal: SIGRTMIN+3
    stop_grace_period: 60s
    environment:
      - container=docker
    platform: linux/amd64
    hostname: whpgdb-primary

secrets:
  edbtoken_secret:
    environment: EDBTOKEN
  edbrepository_secret:
    environment: EDBREPOSITORY
