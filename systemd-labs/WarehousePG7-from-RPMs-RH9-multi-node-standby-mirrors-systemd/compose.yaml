services:
  coordinator:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - edbtoken_secret
        - edbrepository_secret
    deploy:
      resources:
        limits:
          cpus: 4.0
          memory: 4gb
        reservations:
          cpus: 1.0
          memory: 1gb
    secrets:
      - edbtoken_secret
      - edbrepository_secret
    ports:
      - "6448:5432"
      - "18086:8080"
      - "18115:8081"
    volumes:
      - whpg7-rh9-standby-coordinator-data:/whpgdata
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroup: host

    # without an allocated pty, /dev/console never gets created inside the
    # container, so ForwardToConsole/StandardOutput=...+console has nowhere
    # to write and `docker logs` stays empty no matter what journald says
    tty: true
    tmpfs:
      - /run
      - /tmp
    stop_signal: SIGRTMIN+3
    stop_grace_period: 60s
    environment:
      - container=docker
    platform: linux/amd64
    hostname: coordinator
    networks:
      whpg-sme-network:

  standby:
