services:
  sne:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - edbtoken_secret
        - edbrepository_secret
    secrets:
      - edbtoken_secret
      - edbrepository_secret
    ports:
      - "6446:5432"
      - "18085:8080"
      - "17238:7233"
    volumes:
      - ./data:/whpgdata
      - ./usr_local:/usr/local
      # systemd needs the host cgroup hierarchy
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    # systemd-as-PID-1 requirements:
    cgroup: host

    # without an allocated pty, /dev/console never gets created inside the
    # container, so ForwardToConsole/StandardOutput=...+console has nowhere
    # to write and `docker logs` stays empty no matter what journald says
    tty: true
    tmpfs:
      - /run
      - /tmp
    # clean systemd shutdown
    stop_signal: SIGRTMIN+3
    stop_grace_period: 60s
    environment:
      - container=docker
    platform: linux/amd64
    hostname: whpgdb

secrets:
  edbtoken_secret:
    environment: EDBTOKEN
  edbrepository_secret:
    environment: EDBREPOSITORY
