services:
  sne:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "6444:5432"
      - "18084:8080"
      - "17236:7233"
    volumes:
      - ./data:/whpgdata
      # systemd needs the host cgroup hierarchy
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    # systemd-as-PID-1 requirements:
    cgroup: host

    # without an allocated pty, /dev/console never gets created inside the
    # container, so ForwardToConsole/StandardOutput=...+console has nowhere
    # to write and `docker logs` stays empty no matter what journald says
    tty: true
    tmpfs:
      - /run
      - /tmp
    # clean systemd shutdown -> warehousepg.service ExecStop runs gpstop
    stop_signal: SIGRTMIN+3
    stop_grace_period: 60s
    environment:
      - container=docker
    platform: linux/amd64
    hostname: whpgdb-primary
